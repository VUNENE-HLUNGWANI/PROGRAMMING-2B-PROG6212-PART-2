name: .NET Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: |
        dotnet restore RaceDayAPI.csproj
        dotnet restore RaceDayAPI.Tests/RaceDayAPI.Tests.csproj

    - name: Build API project
      run: dotnet build RaceDayAPI.csproj --configuration Release --no-restore

    - name: Build Test project
      run: dotnet build RaceDayAPI.Tests/RaceDayAPI.Tests.csproj --configuration Release --no-restore

    - name: Run tests
      run: dotnet test RaceDayAPI.Tests/RaceDayAPI.Tests.csproj --configuration Release --no-build --verbosity normal
